[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physicsvideo"
version = "0.1.0"
description = "Physical-consistency benchmark for generated video"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ahmed Doghri"}]
dependencies = ["opencv-python-headless>=4.10"]

[project.scripts]
physicsvideo = "physicsvideo.cli:main"

[tool.setuptools]
packages = ["physicsvideo"]

[tool.setuptools.package-data]
physicsvideo = ["web/*.html"]
